name: usuario-service CI

on:
  push:
    paths:
      - 'backend/usuario-service/**'
      - '.github/workflows/usuario-service-ci.yml'
  pull_request:
    paths:
      - 'backend/usuario-service/**'

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend/usuario-service

    steps:
      - uses: actions/checkout@v5

      - name: Configurar JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar y correr tests
        run: mvn -B verify