# --- CONFIGURACION DEL SERVIDOR ---
server.port=8081
spring.application.name=usuario-service

# --- CONEXION A LA BASE DE DATOS (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/reservas_usuarios_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- CONFIGURACION DE HIBERNATE / JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true


# --- CONFIGURACION DE Springdoc ---
# Ordenar los endpoints alfabeticamente por metodo HTTP
springdoc.swagger-ui.operationsSorter=method

# Redirigir la raiz de swagger si deseas una URL directa
springdoc.swagger-ui.path=/swagger-ui.html

# Habilitar o deshabilitar el boton de "Try it out" por defecto
springdoc.swagger-ui.tryItOutEnabled=true